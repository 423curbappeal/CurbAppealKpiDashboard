<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080c14"><title>CEO OS | Recovery</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{min-height:100dvh;margin:0;background:#080c14;color:#f5f8ff;display:grid;place-items:center;padding:20px}.card{width:100%;max-width:420px;border:1px solid #263248;background:#111927;border-radius:20px;padding:26px}h1{font-size:27px;margin:8px 0}p{color:#91a1b8;line-height:1.5}label{font-size:13px;display:block;margin:15px 0 7px}input{width:100%;border:1px solid #34415a;border-radius:11px;background:#0b1423;color:white;padding:13px;font-size:16px}.primary{width:100%;border:0;border-radius:11px;background:#5e99ff;color:#071020;font-weight:800;padding:14px;font-size:16px;margin-top:20px}a{display:block;text-align:center;margin-top:18px;color:#a9c6ff}#status{font-size:13px;min-height:24px}button:disabled{opacity:.6}
</style></head><body><main class="card"><p>PRIVATE COMMAND CENTER</p><h1>Recover your account</h1><p>Use your existing CEO OS username and password. This creates a revocable browser session.</p><form id="recover"><label for="username">Username</label><input id="username" autocomplete="username" required maxlength="160"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required maxlength="500"><button type="submit" class="primary" id="submit">Sign in with password</button></form><a href="/passkey-login">Use Face ID instead</a><p id="status" aria-live="polite"></p></main><script>
document.getElementById('recover').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('submit'),status=document.getElementById('status'),password=document.getElementById('password');button.disabled=true;status.textContent='Verifying recovery credentials…';try{const response=await fetch('/api/recovery/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:password.value})});password.value='';const data=await response.json();if(!response.ok)throw Error(data.error||'Sign-in failed');location.replace('/');}catch(err){status.textContent=err.message||'Unable to sign in';}finally{password.value='';button.disabled=false;}});
</script></body></html>
