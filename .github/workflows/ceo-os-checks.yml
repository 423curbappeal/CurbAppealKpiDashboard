name: CEO OS code checks
on:
  push:
    branches: [feature/ceo-os-mobile]
    paths:
      - 'ceo-os/**'
      - '.github/workflows/ceo-os-checks.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ceo_test
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ceo_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate Python syntax
        run: python -m compileall -q ceo-os
      - name: Validate CEO OS browser scripts and feature targets
        run: |
          node --check ceo-os/command_modules.js
          node --check ceo-os/morning_review.js
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('ceo-os/index.html').read_text()
          module=Path('ceo-os/command_modules.js').read_text()
          morning=Path('ceo-os/morning_review.js').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          assert len(scripts)==1, 'Expected one inline application script'
          with tempfile.NamedTemporaryFile(suffix='.js',mode='w',encoding='utf-8') as f:
              f.write(scripts[0]);f.flush()
              subprocess.run(['node','--check',f.name],check=True)
          ids=set(re.findall(r'\bid="([^"]+)"',html+module+morning))
          referenced=set(re.findall(r"\$\('([^']+)'\)",module+morning))
          assert not (referenced-ids),f'Missing feature element IDs: {referenced-ids}'
          assert 'window.ceoOSBridge=' in html
          assert 'src="/command_modules.js"' in html
          assert 'src="/morning_review.js"' in html
          server=Path('ceo-os/staging_server.py').read_text()
          docker=Path('ceo-os/Dockerfile').read_text()
          assert '"/morning_review.js"' in server
          assert 'morning_review.js' in docker
          assert "['sales','◆','Sales'" in html
          assert "['goals','◎','Goals'" in html
          print('Browser syntax, navigation, and DOM identifier checks passed')
          PY
      - name: Run financial categorization tests
        run: python -m unittest discover -s ceo-os -p 'test_*.py' -v
      - name: Verify synthetic database backup and restore
        env:
          CEO_OS_TEST_MODE: synthetic-fixtures-only
          TEST_PG_HOST: 127.0.0.1
          TEST_PG_USER: ceo_test
          TEST_PG_PASSWORD: synthetic_only
        run: bash ceo-os/test_backup_restore.sh
      - name: Ensure live banking remains opt-in
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          live=Path("ceo-os/plaid_live.py").read_text()
          sandbox=Path("ceo-os/plaid_sandbox.py").read_text()
          ast.parse(live)
          ast.parse(sandbox)
          assert 'HOST = "https://production.plaid.com"' in live
          assert 'PLAID_LIVE_APPROVED' in live
          assert 'RECOVERY_READY' in live
          assert 'ceo_plaid_live' in live
          assert 'ceo_plaid_sandbox' in sandbox
          print("Production and Sandbox isolation checks passed")
          PY
